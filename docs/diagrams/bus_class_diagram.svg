ime backend selection.</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.4758" lengthAdjust="spacing" textLength="235.101" x="622.7974" y="2528.1856">No Zbus dependency.</text></g><g class="entity" data-qualified-name="osal.GMN32" data-source-line="116" id="ent0033"><path d="M569.1079,1534.3561 L569.1079,1599.6094 L522.043,1606.2173 L569.1079,1612.8252 L569.1079,1677.3042 A0,0 0 0 0 569.1079,1677.3042 L1182.6347,1677.3042 A0,0 0 0 0 1182.6347,1677.3042 L1182.6347,1550.8759 L1166.1148,1534.3561 L569.1079,1534.3561 A0,0 0 0 0 569.1079,1534.3561" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.826;"/><path d="M1166.1148,1534.3561 L1166.1148,1550.8759 L1182.6347,1550.8759 L1166.1148,1534.3561" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.826;"/><text fill="#000000" font-family="'Segoe UI'" font-size="21.4758" lengthAdjust="spacing" textLength="552.4034" x="592.2357" y="1575.7661">Observer snapshots use checked bounded storage.</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.4758" lengthAdjust="spacing" textLength="486.9904" x="592.2357" y="1600.7653">Callbacks run outside the registration mutex.</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.4758" lengthAdjust="spacing" textLength="495.1067" x="592.2357" y="1625.7644">native_pubsub and native_observers are true;</text><text fill="#000000" font-family="'Segoe UI'" font-size="21.4758" lengthAdjust="spacing" textLength="464.833" x="592.2357" y="1650.7636">native_routing and zero_copy remain false.</text></g><!--reverse link Bus to BusGeneric--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="extension" data-source-line="31" id="lnk7"><path codeLine="31" d="M1307.6967,1829.8372 C1271.9643,1868.7909 1250.8976,1883.7669 1205.9471,1910.1821 C1104.3998,1969.8682 1020.8095,1873.2437 946.5859,1964.6975 C876.7236,2050.7823 886.2059,2121.1733 946.5859,2214.1468 C1010.5011,2312.5554 1083.1553,2268.3979 1187.7753,2321.5257 C1198.5793,2327.0